route:
  receiver: discord
  group_by: [alertname, job]
  group_wait: 30s        # agrupa alertas que llegan juntas
  group_interval: 5m
  repeat_interval: 4h    # si sigue activa, recuerda cada 4 h (no spam)
  routes:
    - matchers: [severity="critical"]
      receiver: discord
      repeat_interval: 1h

receivers:
  - name: discord
    discord_configs:
      # La URL del webhook es un secreto: se lee de un archivo fuera de Git.
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        message: |-
          {{ range .Alerts }}**{{ .Annotations.summary }}**
          {{ with .Annotations.description }}{{ . }}
          {{ end }}Severidad: `{{ .Labels.severity }}`{{ with .Labels.instance }} · {{ . }}{{ end }}
          {{ end }}

# Si una alerta crítica está activa, no avisar también las de advertencia
# del mismo servicio.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [job]
