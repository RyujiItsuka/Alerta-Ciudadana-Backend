modules:
  http_2xx:
    prober: http
    timeout: 15s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: true

  # Preflight CORS de las Edge Functions: 200 "ok" sin autenticación ni efectos.
  http_options_2xx:
    prober: http
    timeout: 15s
    http:
      method: OPTIONS
      preferred_ip_protocol: ip4
      headers:
        Origin: https://alertaciudadana.pages.dev
        Access-Control-Request-Method: POST

  # Latencia de la base de datos: consulta mínima de solo lectura a PostgREST
  # (GET tipo_incidencia, 1 fila). Usa la anon key, que es PÚBLICA (viaja en
  # el panel web y en el APK); no da acceso a datos protegidos por RLS.
  http_postgrest:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
