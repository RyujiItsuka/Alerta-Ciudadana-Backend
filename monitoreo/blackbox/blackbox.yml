modules:
  http_2xx:
    prober: http
    timeout: 15s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: true

  # Preflight CORS de las Edge Functions: 200 "ok" sin autenticación ni efectos.
  http_options_2xx:
    prober: http
    timeout: 15s
    http:
      method: OPTIONS
      preferred_ip_protocol: ip4
      headers:
        Origin: https://alertaciudadana.pages.dev
        Access-Control-Request-Method: POST
