# Reglas de alerta técnicas. severity: critical | warning
# Reglas de Supabase verificadas el 2026-11-19 contra el endpoint real
# (319 métricas: node_*, pg_*, pgbouncer_*, realtime_*...). Si Supabase
# cambia un nombre, la regla deja de disparar: revisar en Prometheus (Explore)
# y ajustar.

groups:
  - name: disponibilidad
    rules:
      - alert: PanelWebCaido
        expr: probe_success{job="web"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "El panel de la Central no responde"
          description: "{{ $labels.instance }} falla desde hace 3 min. Los operadores no pueden ver alertas."

      - alert: EdgeFunctionCaida
        expr: probe_success{job="edge-functions"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "Edge Function sin respuesta"
          description: "{{ $labels.instance }} no responde desde hace 3 min."

      - alert: EdgeFunctionLenta
        expr: probe_duration_seconds{job="edge-functions"} > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Edge Function lenta"
          description: "{{ $labels.instance }} tarda {{ $value | humanizeDuration }} en responder."

      - alert: CertificadoPorVencer
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Certificado TLS por vencer"
          description: "El certificado de {{ $labels.instance }} vence en {{ $value | printf \"%.0f\" }} días."

  - name: supabase
    rules:
      - alert: SupabaseSinMetricas
        expr: up{job="supabase"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "No se pueden leer las métricas de Supabase"
          description: "El endpoint de métricas no responde o rechaza la clave desde hace 5 min."

      - alert: DiscoCasiLleno
        expr: max by (instance) (1 - node_filesystem_avail_bytes{job="supabase",mountpoint="/data"} / node_filesystem_size_bytes{job="supabase",mountpoint="/data"}) > 0.80
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Disco de la base de datos al {{ $value | humanizePercentage }}"
          description: "Revisar crecimiento de tablas (p. ej. ubicacion) antes de llegar al límite del plan."

      - alert: MemoriaAlta
        expr: 1 - node_memory_MemAvailable_bytes{job="supabase"} / node_memory_MemTotal_bytes{job="supabase"} > 0.90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Memoria de la base de datos al {{ $value | humanizePercentage }}"

      - alert: PostgresCaido
        expr: pg_up{job="supabase"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL de Supabase no responde"
          description: "La base de datos está caída: no se registran alertas ni sesiones."

      - alert: ConexionesAltas
        expr: sum(pg_stat_database_num_backends{job="supabase"}) / max(max_connections_connection_count{job="supabase"}) > 0.80
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Conexiones a PostgreSQL al {{ $value | humanizePercentage }} del máximo"

  # ---------------------------------------------------------------------------
  # Métricas definidas por el equipo (umbrales y acciones acordados).
  # ---------------------------------------------------------------------------
  - name: metricas_definidas
    rules:
      # Tamaño de la base de datos frente al límite de 500 MB del plan.
      - alert: BaseDatosTamanoAdvertencia
        expr: alerta:bd_tamano_ratio > 0.70
        for: 10m
        labels: { severity: warning, metrica: tamano-bd }
        annotations:
          summary: "Base de datos al {{ $value | humanizePercentage }} del límite de 500 MB"
          description: "Supera el 70 % (350 MB). Acción: revisar qué tablas crecen y planificar una limpieza."

      - alert: BaseDatosTamanoCritico
        expr: alerta:bd_tamano_ratio > 0.85
        for: 10m
        labels: { severity: critical, metrica: tamano-bd }
        annotations:
          summary: "Base de datos al {{ $value | humanizePercentage }} del límite de 500 MB"
          description: "Supera el 85 % (425 MB). Acción: abrir un incidente y archivar los reportes ya atendidos."

      # Uso de CPU. Fracción ocupada = no-idle / total; sin datos nuevos da
      # NaN y no dispara (evita el falso 100 % del endpoint de Supabase).
      - alert: CPUAdvertencia
        expr: alerta:cpu_uso_ratio > 0.70
        for: 10m
        labels: { severity: warning, metrica: cpu }
        annotations:
          summary: "CPU de la base de datos al {{ $value | humanizePercentage }} durante 10 min"
          description: "Acción: identificar consultas pesadas, picos de tráfico u otra causa del uso excesivo de CPU."

      - alert: CPUCritico
        expr: alerta:cpu_uso_ratio > 0.90
        for: 5m
        labels: { severity: critical, metrica: cpu }
        annotations:
          summary: "CPU de la base de datos al {{ $value | humanizePercentage }} durante 5 min"
          description: "Acción: abrir un incidente; si es tráfico anómalo, bloquear la IP de origen."

      # Latencia de la base de datos: tiempo de procesamiento en el servidor de
      # una consulta mínima vía PostgREST (sonda cada 30 s, job bd-latencia).
      # Se mide la fase "processing" (sin el viaje de red de ida), porque el
      # tiempo total desde Perú a São Paulo ya ronda los 350 ms.
      - alert: BaseDatosLatenciaAdvertencia
        # 3 chequeos seguidos (cada 30 s) por encima de 300 ms.
        expr: min_over_time(alerta:bd_latencia_segundos[90s]) > 0.300
        labels: { severity: warning, metrica: latencia-bd }
        annotations:
          summary: "Latencia de la base de datos > 300 ms en 3 chequeos seguidos ({{ $value | humanizeDuration }})"
          description: "Acción: revisar consultas lentas, conexiones abiertas o uso de CPU."

      - alert: BaseDatosLatenciaCritica
        expr: alerta:bd_latencia_segundos > 1 or alerta:bd_disponible == 0
        for: 1m
        labels: { severity: critical, metrica: latencia-bd }
        annotations:
          summary: "Base de datos sin respuesta o con latencia > 1 s"
          description: "Acción: cerrar las conexiones colgadas."
