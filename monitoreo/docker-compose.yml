# Monitoreo técnico de Alerta Ciudadana: Prometheus + Alertmanager (Discord)
# + Blackbox (disponibilidad de la web y las Edge Functions) + Grafana.
#
# Uso:   cd monitoreo && docker compose up -d
# Antes: crear los archivos de secrets/ (ver README.md de esta carpeta).
#
# Son alertas TÉCNICAS (el sistema falla), no emergencias ciudadanas.

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ac-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./secrets/supabase_metrics_key:/run/secrets/supabase_metrics_key:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [alertmanager, blackbox]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: ac-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - ./secrets/discord_webhook_url:/run/secrets/discord_webhook_url:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    container_name: ac-blackbox
    restart: unless-stopped
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox:/etc/blackbox:ro

  grafana:
    image: grafana/grafana:12.0.2
    container_name: ac-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

# Los puertos se publican solo en 127.0.0.1: no quedan expuestos a la red.
# En un servidor, acceder por túnel SSH o detrás de un proxy con HTTPS.

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
